name: Build RAM Force Cleaner APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --project-name=ram_cleaner --org=com.example --platforms=android .
          sed -i "s/minSdkVersion .*/minSdkVersion 23/" android/app/build.gradle
      - name: Apply custom native files
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/ram_cleaner
          cp custom_files/MainActivity.kt android/app/src/main/kotlin/com/example/ram_cleaner/
          cp custom_files/AutoCleanService.kt android/app/src/main/kotlin/com/example/ram_cleaner/
          cp custom_files/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: Apply custom drawables
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/values
          cp custom_files/res/drawable/ic_launcher_foreground.xml android/app/src/main/res/drawable/
          cp custom_files/res/values/ic_launcher_background.xml android/app/src/main/res/values/
          cp custom_files/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: ram-force-cleaner-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
